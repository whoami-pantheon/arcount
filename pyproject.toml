[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arcount"
version = "0.1.0"
description = "ARP attack detection for roaming Linux laptops: per-network memory, active confirmation, desktop alerts"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Clive Akporube", email = "clivekaiser22@gmail.com" }]
keywords = ["arp", "arp-spoofing", "security", "arpwatch", "network", "mitm", "linux"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Topic :: System :: Networking :: Monitoring",
  "Topic :: Security",
]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/whoami-pantheon/arcount"
Issues = "https://github.com/whoami-pantheon/arcount/issues"

[project.optional-dependencies]
dev = ["pytest", "scapy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src", "tests/lab", "tests/unit"]
addopts = "-q"
markers = ["lab: needs root and network namespaces"]

[tool.setuptools.package-data]
arcount = ["data/*"]
