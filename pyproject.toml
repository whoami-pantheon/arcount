[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arcount"
version = "0.1.0"
description = "ARP attack detection for roaming Linux laptops"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "scapy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src", "tests/lab", "tests/unit"]
addopts = "-q"
markers = ["lab: needs root and network namespaces"]

[tool.setuptools.package-data]
arcount = ["data/*"]
